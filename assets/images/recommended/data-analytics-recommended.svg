<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="analyticsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <filter id="badgeShadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0891b2" flood-opacity="0.25" />
    </filter>
  </defs>
  <polygon points="250 30, 430 134, 430 342, 250 446, 70 342, 70 134" fill="#ffffff" stroke="#0891b2" stroke-width="12" filter="url(#badgeShadow4)" />
  <polygon points="250 50, 410 146, 410 330, 250 426, 90 330, 90 146" fill="url(#analyticsGrad)" />
  
  <text x="250" y="135" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">DATA &amp; BI</text>
  
  <!-- Centered White Text Box -->
  <rect x="120" y="165" width="260" height="105" fill="#ffffff" rx="12" />
  <text x="250" y="208" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="26" font-weight="900" fill="#0891b2" text-anchor="middle">Data Analytics</text>
  <text x="250" y="246" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="middle">&amp; Power BI</text>
  
  <text x="250" y="325" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">PROFESSIONAL</text>
</svg>