<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="awsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="badgeShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Outer Hexagon Badge matching screenshot -->
  <polygon points="250 30, 430 134, 430 342, 250 446, 70 342, 70 134" fill="#ffffff" stroke="#0284c7" stroke-width="12" filter="url(#badgeShadow2)" />
  <polygon points="250 50, 410 146, 410 330, 250 426, 90 330, 90 146" fill="url(#awsGrad)" />
  
  <text x="250" y="140" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">AWS CERTIFIED</text>
  
  <!-- DevOps Engineer Text Box -->
  <rect x="130" y="170" width="240" height="95" fill="#ffffff" rx="10" />
  <text x="250" y="212" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="30" font-weight="900" fill="#0284c7" text-anchor="middle">DevOps</text>
  <text x="250" y="248" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="800" fill="#0f172a" text-anchor="middle">Engineer</text>
  
  <text x="250" y="320" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">PROFESSIONAL</text>
</svg>