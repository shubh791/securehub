<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="20" fill="#0f172a"/>
  <g transform="translate(15, 15) scale(0.7)">
    <!-- AWS Orange Hexagon Badge -->
    <polygon points="50,5 90,28 90,72 50,95 10,72 10,28" fill="url(#awsGrad)" stroke="#ff9900" stroke-width="3"/>
    <defs>
      <linearGradient id="awsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#232f3e"/>
        <stop offset="100%" stop-color="#131921"/>
      </linearGradient>
    </defs>
    <!-- AWS Text & Smile Arrow -->
    <text x="50" y="45" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle">aws</text>
    <path d="M 28 55 Q 50 68 72 55" fill="none" stroke="#ff9900" stroke-width="4" stroke-linecap="round"/>
    <polygon points="72,55 67,50 66,57" fill="#ff9900"/>
    <text x="50" y="80" font-family="Arial, sans-serif" font-weight="800" font-size="11" fill="#00d2ff" text-anchor="middle">DEVOPS</text>
  </g>
</svg>